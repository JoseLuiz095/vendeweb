name: Publicar confirmação Pix da loja

on:
  workflow_dispatch:
    inputs:
      publish_confirmation:
        description: Digite PUBLICAR para publicar food-order-payment no projeto fixo VendeWeb.
        required: true
        type: choice
        options:
          - CANCELAR
          - PUBLICAR

permissions:
  contents: read

concurrency:
  group: food-order-payment-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.publish_confirmation == 'PUBLICAR'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar credenciais e alvo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Secret SUPABASE_ACCESS_TOKEN ausente." >&2
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" != "elttryavkeartoxgdgse" ]; then
            echo "SUPABASE_PROJECT_REF deve apontar para o VendeWeb (elttryavkeartoxgdgse)." >&2
            exit 1
          fi

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Publicar somente food-order-payment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy food-order-payment --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
