name: Operação de aluguel
on:
  pull_request:
    paths:
      - 'src/modules/**'
      - 'scripts/modules-db-test.mjs'
      - 'scripts/rental-*.mjs'
      - 'qa/rentals.config.ts'
      - 'qa/tests/modules/rental-operations.spec.ts'
      - 'supabase/migrations/*food_rental_operations.sql'
      - '.github/workflows/rentals.yml'
permissions:
  contents: read
jobs:
  rentals:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/package-lock.json
      - run: npm ci
      - run: npm ci --prefix qa
      - run: npm run typecheck
      - run: node scripts/rental-operations-test.mjs
      - run: node scripts/modules-db-test.mjs
      - run: npm install --prefix "$RUNNER_TEMP/food-db-runtime" --no-save --no-audit --no-fund embedded-postgres@17.9.0-beta.17 pg@8.16.3
      - name: Reservas, manutenção e eventos simultâneos em PostgreSQL 17
        env:
          FOOD_DB_TEST_RUNTIME: ${{ runner.temp }}/food-db-runtime/node_modules
        run: node scripts/rental-postgres-test.mjs
      - run: npm exec --prefix qa -- playwright install --with-deps chromium
      - name: Fluxos mobile e desktop
        working-directory: qa
        run: ./node_modules/.bin/playwright test --config rentals.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rental-operation-qa
          path: |
            qa/test-results/
            qa/playwright-report/modules/
          retention-days: 7
