name: Fitness editor
on:
  pull_request:
    paths:
      - 'src/platform/FitnessWorkout*'
      - 'src/platform/FitnessExerciseFields.tsx'
      - 'src/platform/fitness.css'
      - 'src/services/fitnessApi.ts'
      - 'qa/fitness-editor*'
      - 'qa/tests/fitness-editor/**'
      - '.github/workflows/fitness-editor.yml'
  workflow_dispatch:
jobs:
  fitness-editor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm ci
      - run: npm ci --prefix qa
      - run: npm exec --prefix qa -- playwright install --with-deps chromium
      - run: npm exec --prefix qa -- playwright test --config qa/fitness-editor.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fitness-editor-failure
          path: qa/test-results
          retention-days: 7
